# 容器只出界面，/api 与 /ws 转发给 Windows 上的 COM 宿主。
# 推荐 .\Scripts\StartDocker.ps1 同时启动两端；Compose 自身不能启动 Windows 控制服务。
# 手动启动用 .\Scripts\StartBackend.ps1 -Docker（0.0.0.0:8081），端口须与 API_UPSTREAM 一致。
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: kugou-dashboard:latest
    container_name: kugou-dashboard
    ports:
      - "8080:8000"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8081}
    extra_hosts:
      # Linux 容器里 host.docker.internal 不会自动出现，显式指向宿主机。
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
